name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

env:
  CODEX_CLI_VERSION: 0.146.0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Codex CLI for plugin smoke
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "@openai/codex@${CODEX_CLI_VERSION}"
          test "$(codex --version)" = "codex-cli ${CODEX_CLI_VERSION}"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: npm run smoke:release

      - name: Upload package evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-node-24-package-evidence
          path: |
            dist/
            plugins/codex-external-agents/runtime/
          if-no-files-found: error
          retention-days: 7
