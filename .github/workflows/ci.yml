name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Codex CLI for plugin smoke
        shell: bash
        run: |
          set -euo pipefail
          codex_cli_version="$(node -p "require('./package.json').config.codexCliVersion")"
          if [[ ! "$codex_cli_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json config.codexCliVersion must be an exact version"
            exit 1
          fi
          npm install --global "@openai/codex@${codex_cli_version}"
          test "$(codex --version)" = "codex-cli ${codex_cli_version}"

      - run: npm ci
      - run: npm run gate:offline
